server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name {{TUNNEL_DOMAIN}} "~^[a-f0-9]{8}-tunnel\.{{TUNNEL_DOMAIN_REGEX}}$";

    ssl_certificate {{SSL_CERT_PATH}};
    ssl_certificate_key {{SSL_KEY_PATH}};

    access_log /var/log/nginx/fire-tunnel.access.log;
    error_log /var/log/nginx/fire-tunnel.error.log;

    location / {
        if ($fire_tunnel_port = "") {
            default_type text/html;
            return 404 '<!DOCTYPE html><html><head><title>Tunnel Inactive</title></head><body style="font-family:system-ui,-apple-system,sans-serif; text-align:center; padding-top:100px; background:#0d1117; color:#c9d1d9;"><h1>404 &mdash; Tunnel Inactive</h1><p>The requested Fire PM tunnel is inactive or does not exist.</p></body></html>\n';
        }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass http://127.0.0.1:$fire_tunnel_port;
    }
}
