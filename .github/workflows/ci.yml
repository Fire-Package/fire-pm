name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli-ssh-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r tui/requirements.txt

      - name: Syntax checks (Bash, Python, inline JS)
        run: |
          bash -n app/fire
          bash -n install.sh
          python3 -m py_compile app/fire_ssh.py tui/fire_tui.py tools/upload_assets.py

      - name: Run pytest suite
        run: pytest -v tests/

  web-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: npx tsc --noEmit
